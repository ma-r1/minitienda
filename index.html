<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Minitienda</title>
    <link rel="stylesheet" href="css/stylesheet.css" />
  </head>

  <body bgcolor="#FDF5E6">
    <table align="center" border="0">
      <tr>
        <th>
          <img
            src="./imgs/music-svgrepo-com.svg"
            align="CENTER"
            width="50px"
            height="50px"
          />
        </th>
        <th>
          <font face="Times New Roman,Times" size="+3">Música para DAW</font>
        </th>
        <th>
          <img
            src="./imgs/music-svgrepo-com.svg"
            align="CENTER"
            width="50px"
            height="50px"
          />
        </th>
      </tr>
    </table>

    <hr />
    <!--Formularios para enviar la selección de CD al Servlet controlador a través de solicitudes post
        los parámetros viajan a través de la solicitud -->
    <form method="post" action="ServletFrontController">
      <b>CD:</b>
      <!--Dropdown con selección de las entradas de los discos hardcodeados-->
      <select name="nombre">
        <option value="Yuan | The Guo Brothers | China | $14.95">
          Yuan — The Guo Brothers · China · $14.95
        </option>
        <option value="Drums of Passion | Babatunde Olatunji | Nigeria | $16.95">
          Drums of Passion — Babatunde Olatunji · Nigeria · $16.95
        </option>
        <option value="Kaira | Tounami Diabate | Mali | $16.95">
          Kaira — Tounami Diabate · Mali · $16.95
        </option>
        <option value="The Lion is Loose | Eliades Ochoa | Cuba | $13.95">
          The Lion is Loose — Eliades Ochoa · Cuba · $13.95
        </option>
        <option value="Dance the Devil Away | Outback | Australia | $14.95">
          Dance the Devil Away — Outback · Australia · $14.95
        </option>
        <option value="Record of Changes | Samulnori | Korea | $12.95">
          Record of Changes — Samulnori · Korea · $12.95
        </option>
        <option value="Djelika | Tounami Diabate | Mali | $14.95">
          Djelika — Tounami Diabate · Mali · $14.95
        </option>
        <option value="Rapture | Nusrat Fateh Ali Khan | Pakistan | $12.95">
          Rapture — Nusrat Fateh Ali Khan · Pakistan · $12.95
        </option>
        <option value="Cesaria Evora | Cesaria Evora | Cape Verde | $16.95">
          Cesaria Evora — Cesaria Evora · Cape Verde · $16.95
        </option>
        <option value="DAA | GSTIC | Spain | $50.00">
          DAA — GSTIC · Spain · $50.00
        </option>
      </select>
      <b>Cantidad:</b>
      <!--Input para la cantidad de CDs que se seleccionan-->
      <input type="text" name="cantidad" value="1" />
      <input type="submit" value="Seleccionar" />
      <!--Input oculto para enviar el tipo de acción-->
      <input type="hidden" name="accion" value="anadircd" />
    </form>
    <a href="ServletFrontController?accion=mostrarcarrito">Ir al carrito</a>
  </body>
</html>
